<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, createContext, useContext } = React;

// ── Supabase ──────────────────────────────────────────────────────────────────
const { createClient } = supabase;
const sb = createClient(
  'https://hkicyucebizazhqcvfht.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraWN5dWNlYml6YXpocWN2Zmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDM0OTMsImV4cCI6MjA5NjI3OTQ5M30.WFGPyzBzUjwQz0sFx864rUIpr_BRTGU-9dPuUFRNgBg'
);
const getLivraisons = async () => { const {data,error} = await sb.from('livraisons').select('*').order('created_at',{ascending:false}); if(error)throw error; return data; };
const addLivraison = async ({commande,jour,creneau,tournee,client,statut}) => { const {data,error} = await sb.from('livraisons').insert([{commande:commande.toUpperCase(),jour,creneau,tournee:tournee||'',client:client||'',statut:statut||'planifiee'}]).select(); if(error)throw error; return data[0]; };
const updateLivraison = async (id,updates) => { const {data,error} = await sb.from('livraisons').update(updates).eq('id',id).select(); if(error)throw error; return data[0]; };
const deleteLivraison = async (id) => { const {error} = await sb.from('livraisons').delete().eq('id',id); if(error)throw error; };
const deleteManyByStatut = async (statut) => {
  const {error} = await sb.from('livraisons').delete().eq('statut', statut);
  if(error) throw error;
};

const getLivraisonByCommande = async (commande) => { const {data,error} = await sb.from('livraisons').select('*').eq('commande',commande.toUpperCase()); if(error)throw error; return data; };

// ── Auth ──────────────────────────────────────────────────────────────────────
const GROUPS = {
  ADV:   {role:'adv',        label:'ADV',                     pages:['suivi','agenda']},
  WICKY: {role:'responsable',label:'Responsable des tournées', pages:['suivi','agenda','tournees','livreur']},
  ROUTE: {role:'livreur',    label:'Livreur',                  pages:['livreur']},
};
const AuthCtx = createContext(null);
function AuthProvider({children}) {
  const [session,setSession] = useState(() => { try { const s=sessionStorage.getItem('attis-s'); return s?JSON.parse(s):null; } catch{return null;} });
  const login = (code) => { const g=GROUPS[code.trim().toUpperCase()]; if(!g)return false; const s={code:code.trim().toUpperCase(),...g}; setSession(s); sessionStorage.setItem('attis-s',JSON.stringify(s)); return true; };
  const logout = () => { setSession(null); sessionStorage.removeItem('attis-s'); };
  return <AuthCtx.Provider value={{session,login,logout}}>{children}</AuthCtx.Provider>;
}
const useAuth = () => useContext(AuthCtx);

// ── Date utilities ────────────────────────────────────────────────────────────
const JOUR_NOMS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS_NOMS = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];

function getJoursOuvres() {
  const jours = [];
  const auj = new Date(); auj.setHours(0,0,0,0);
  let d = new Date(auj);
  while(jours.length < 6) {
    if(d.getDay() !== 0 && d.getDay() !== 6) jours.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return jours;
}

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const j = String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+j;
}

function dateBadge(date) {
  const auj = new Date(); auj.setHours(0,0,0,0);
  const dem = new Date(auj); dem.setDate(auj.getDate()+1);
  if(date.getTime()===auj.getTime()) return {text:"Aujourd'hui", color:'#e8a030'};
  if(date.getTime()===dem.getTime()) return {text:'Demain', color:'#2563eb'};
  return null;
}

function dateLabel(date) {
  return JOUR_NOMS[date.getDay()]+' '+date.getDate()+' '+MOIS_NOMS[date.getMonth()];
}

function dateLabelCourt(date) {
  return JOUR_NOMS[date.getDay()].slice(0,3)+' '+date.getDate()+'/'+String(date.getMonth()+1).padStart(2,'0');
}

// ── Constants ─────────────────────────────────────────────────────────────────
const SLOTS = ['Matin','Après-midi'];
const LIVREURS = ['Manjula','George','Vladimir','Said','Houssem','Extérieur','Autre'];
const STATUS = {
  aplanifier:{label:'À planifier', color:'#7c3aed',bg:'#f5f3ff',border:'#c4b5fd',dot:'#7c3aed'},
  planifiee: {label:'Planifiée',   color:'#2563eb',bg:'#eff6ff',border:'#bfdbfe',dot:'#2563eb'},
  confirmee: {label:'Confirmée',   color:'#d97706',bg:'#fffbeb',border:'#fcd34d',dot:'#d97706'},
  livree:    {label:'Livrée',      color:'#16a34a',bg:'#f0fdf4',border:'#86efac',dot:'#16a34a'},

// ── SignaturePad ──────────────────────────────────────────────────────────────
function SignaturePad({onSave,onCancel,commande}) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const lastPos = useRef(null);
  const getPos = (e,canvas) => { const rect=canvas.getBoundingClientRect(); const src=e.touches?e.touches[0]:e; return {x:src.clientX-rect.left,y:src.clientY-rect.top}; };
  const start = (e) => { e.preventDefault(); drawing.current=true; lastPos.current=getPos(e,canvasRef.current); };
  const move = (e) => { e.preventDefault(); if(!drawing.current)return; const canvas=canvasRef.current; const ctx=canvas.getContext('2d'); const pos=getPos(e,canvas); ctx.beginPath(); ctx.moveTo(lastPos.current.x,lastPos.current.y); ctx.lineTo(pos.x,pos.y); ctx.strokeStyle='#1a2d6b'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); lastPos.current=pos; };
  const stop = (e) => { e.preventDefault(); drawing.current=false; };
  const clear = () => { const c=canvasRef.current; c.getContext('2d').clearRect(0,0,c.width,c.height); };
  const isEmpty = () => !canvasRef.current.getContext('2d').getImageData(0,0,canvasRef.current.width,canvasRef.current.height).data.some(v=>v!==0);
  const save = () => { if(isEmpty()){alert('Veuillez apposer une signature.');return;} onSave(canvasRef.current.toDataURL('image/png')); };
  useEffect(() => { const c=canvasRef.current; c.width=c.parentElement.clientWidth-48; c.height=180; },[]);
  return (
    <div className="overlay">
      <div className="modal sig-modal">
        <div className="sig-header"><div className="sig-title">Signature du client</div><div className="sig-cmd">{commande}</div></div>
        <p className="sig-hint">Faites signer le client dans le cadre ci-dessous</p>
        <div className="sig-box"><canvas ref={canvasRef} onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop} onTouchStart={start} onTouchMove={move} onTouchEnd={stop} style={{cursor:'crosshair',display:'block',touchAction:'none'}}/></div>
        <div className="sig-actions">
          <button className="btn-ghost" onClick={clear}>Effacer</button>
          <button className="btn-ghost" onClick={onCancel}>Annuler</button>
          <button className="btn-primary" onClick={save}>Valider ✓</button>
        </div>
      </div>
    </div>
  );
}

// ── Import AS400 ─────────────────────────────────────────────────────────────
function ImportAS400({ deliveries, onImport }) {
  const [importing, setImporting] = useState(false);
  const [preview, setPreview] = useState(null);
  const fileRef = useRef(null);

  const parseDate = (val) => {
    // Format AS400 : 20260707 → "2026-07-07"
    const s = String(val);
    if(s.length === 8) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
    return null;
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        
        // Filtrer les lignes type "1" (entêtes commandes)
        const existingNums = new Set(deliveries.map(d => String(d.commande)));
        const parsed = [];
        
        for(const row of rows) {
          if(String(row[0]) !== '1') continue; // uniquement les entêtes
          const num = String(row[4]); // N° commande
          const client = String(row[7]||'').trim(); // Désignation client
          const dateRaw = row[14]; // Délai confirmé
          const jour = parseDate(dateRaw);
          
          if(!num || num==='undefined') continue;
          if(existingNums.has(num)) continue; // deja dans l app
          if(!jour) continue;
          
          parsed.push({ commande: num, client, jour });
        }
        
        setPreview(parsed);
      } catch(err) {
        alert('Erreur lors de la lecture du fichier : '+err.message);
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = ''; // reset input
  };

  const handleImport = async () => {
    if(!preview||preview.length===0) return;
    setImporting(true);
    const imported = [];
    let skipped = 0;
    try {
      for(const p of preview) {
        try {
          const created = await addLivraison({commande:p.commande, jour:p.jour, creneau:'', tournee:'', client:p.client, statut:'aplanifier'});
          imported.push(created);
        } catch(err) {
          // Doublon ou autre erreur sur cette commande -> on passe à la suivante
          skipped++;
        }
      }
      onImport(imported);
      setPreview(null);
    } catch(err) {
      alert('Erreur import : '+err.message);
    } finally {
      setImporting(false);
    }
  };

  const formatJourPreview = (key) => {
    const d = new Date(key+'T00:00:00');
    return dateLabel(d);
  };

  return (
    <div className="card form-card" style={{borderLeft:'4px solid var(--gold)'}}>
      <div className="card-title">📥 Import AS400</div>
      
      {!preview && (
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <p style={{fontSize:'0.85rem',color:'var(--muted)',flex:1}}>
            Importez votre fichier Excel AS400 pour créer automatiquement les commandes. Le créneau et la tournée seront à compléter ensuite.
          </p>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={handleFile}/>
          <button className="btn-primary" style={{background:'var(--gold)',color:'#122057'}} onClick={()=>fileRef.current.click()}>
            📂 Choisir un fichier Excel
          </button>
        </div>
      )}

      {preview && (
        <>
          <div style={{marginBottom:14}}>
            <p style={{fontSize:'0.88rem',fontWeight:600,color:'var(--navy)',marginBottom:4}}>
              {preview.length} commande{preview.length>1?'s':''} à importer
              {preview.length===0 && ' (toutes deja presentes)'}
            </p>
            <p style={{fontSize:'0.78rem',color:'var(--muted)'}}>Le créneau et la tournée sont à compléter après l’import.</p>
          </div>

          {preview.length > 0 && (
            <div style={{maxHeight:240,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8,marginBottom:14}}>
              {preview.map((p,i) => (
                <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 14px',borderBottom:'1px solid var(--bg2)',fontSize:'0.85rem'}}>
                  <span style={{fontFamily:'Courier New',fontWeight:700,color:'var(--navy)',minWidth:80}}>{p.commande}</span>
                  <span style={{flex:1,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.client}</span>
                  <span style={{color:'var(--muted)',whiteSpace:'nowrap',fontSize:'0.78rem'}}>{formatJourPreview(p.jour)}</span>
                </div>
              ))}
            </div>
          )}

          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn-ghost" onClick={()=>setPreview(null)}>Annuler</button>
            {preview.length > 0 && (
              <button className="btn-primary" onClick={handleImport} disabled={importing}>
                {importing ? 'Import en cours…' : 'Importer ' + preview.length + ' commande' + (preview.length>1?'s':'')}
              </button>
            )}
          </div>
        </>
      )}
    </div>
  );
}

  const showFlash = (type,msg) => { setFlash({type,msg}); setTimeout(()=>setFlash(null),3000); };

  const handleSave = async () => {
    if(!form.commande.trim()||!form.jour||!form.creneau||!form.tournee){showFlash('error','Tous les champs sont requis.');return;}
    const num=form.commande.trim().toUpperCase();
    if(deliveries.find(d=>d.commande===num&&d.id!==editId)){showFlash('error',`La commande ${num} existe déjà.`);return;}
    setSaving(true);
    try {
      if(editId){ const updated=await updateLivraison(editId,{commande:num,jour:form.jour,creneau:form.creneau}); setDeliveries(prev=>prev.map(d=>d.id===editId?updated:d)); showFlash('ok','Commande mise à jour ✓'); setEditId(null); }
      else { const created=await addLivraison({commande:num,jour:form.jour,creneau:form.creneau,tournee:form.tournee}); setDeliveries(prev=>[created,...prev]); showFlash('ok','Commande ajoutée ✓'); }
      setForm({commande:'',jour:'',creneau:'',tournee:''});
    } catch(e){showFlash('error','Erreur lors de la sauvegarde.');}
    finally{setSaving(false);}
  };

  const toggleConfirm = async (d) => {
    if(d.statut==='livree') return;
    if(d.statut==='aplanifier') { setPlanifierModal(d); return; }
    let newStatut;
    if(d.statut==='planifiee') newStatut='confirmee';
    else if(d.statut==='confirmee') newStatut='planifiee';
    try { const updated=await updateLivraison(d.id,{statut:newStatut}); setDeliveries(prev=>prev.map(x=>x.id===d.id?updated:x)); } catch(e){console.error(e);}
  };

  const handlePlanifier = async (creneau, tournee) => {
    try {
      const updated = await updateLivraison(planifierModal.id, {statut:'planifiee', creneau, tournee});
      setDeliveries(prev => prev.map(x => x.id===planifierModal.id ? updated : x));
      setPlanifierModal(null);
    } catch(e) { console.error(e); }
  };

  const handleDelete = async (id) => {
    try { await deleteLivraison(id); setDeliveries(prev=>prev.filter(d=>d.id!==id)); setDeleteConfirm(null); } catch(e){console.error(e);}
  };

  const grouped = {};
  jours.forEach(j => { const k=dateKey(j); grouped[k]=deliveries.filter(d=>d.jour===k).sort((a,b)=>SLOTS.indexOf(a.creneau)-SLOTS.indexOf(b.creneau)); });

  const counts = {aplanifier:0,planifiee:0,confirmee:0,livree:0};
  deliveries.forEach(d=>{if(counts[d.statut]!==undefined)counts[d.statut]++;});

  if(loading)return <div className="loading">Chargement…</div>;
  return (
    <div className="page">
      <div className="page-hero">
        <h2>Planification des tournées</h2><p>Gérez et confirmez le planning de livraison</p>
        <div className="hero-stats">
          <span className="hstat" style={{color:'#93c5fd'}}>🔵 {counts.planifiee} planifiée{counts.planifiee>1?'s':''}</span>
          <span className="hstat" style={{color:'#fcd34d'}}>🟡 {counts.confirmee} confirmée{counts.confirmee>1?'s':''}</span>
          <span className="hstat" style={{color:'#86efac'}}>🟢 {counts.livree} livrée{counts.livree>1?'s':''}</span>
        </div>
      </div>
      {flash&&<div className={`flash flash-${flash.type}`}>{flash.msg}</div>}

      {/* Import AS400 */}
      <ImportAS400 deliveries={deliveries} onImport={(nouvelles) => { setDeliveries(prev => [...nouvelles, ...prev]); showFlash('ok', nouvelles.length + ' commande' + (nouvelles.length>1?'s':'') + ' importée' + (nouvelles.length>1?'s':'') + ' ✓'); }} />

      {/* Suppression en masse */}
      <BulkDelete deliveries={deliveries} onDeleted={(statut) => { setDeliveries(prev => prev.filter(d => d.statut !== statut)); showFlash('ok', 'Commandes supprimées ✓'); }} />
      <div className="card form-card">
        <div className="card-title">{editId?'✏️ Modifier':'➕ Nouvelle livraison'}</div>
        <div className="form-grid">
          <div className="field"><label>N° de commande</label><input placeholder="ex. CMD-1042" value={form.commande} onChange={e=>setForm({...form,commande:e.target.value})} onKeyDown={e=>e.key==='Enter'&&handleSave()}/></div>
          <div className="field">
            <label>Jour de livraison</label>
            <div className="toggle-group">
              {jours.map(d => {
                const k = dateKey(d);
                const badge = dateBadge(d);
                return (
                  <button key={k} className={`toggle-btn ${form.jour===k?'active':''}`} onClick={()=>setForm({...form,jour:k})}>
                    <span style={{fontSize:'0.78rem',fontWeight:700}}>{dateLabelCourt(d)}</span>
                    {badge&&<span style={{fontSize:'0.6rem',background:form.jour===k?'rgba(255,255,255,0.3)':badge.color,color:'white',borderRadius:4,padding:'1px 5px',fontWeight:800}}>{badge.text}</span>}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="field">
            <label>Créneau</label>
            <div className="toggle-group">
              {SLOTS.map(s=><button key={s} className={`toggle-btn ${form.creneau===s?'active':''}`} onClick={()=>setForm({...form,creneau:s})}>{s==='Matin'?<><SunIcon/> Matin</>:<><MoonIcon/> Après-midi</>}</button>)}
            </div>
          </div>
          <div className="field" style={{gridColumn:'1 / -1'}}>
            <label>Tournée (livreur)</label>
            <div className="toggle-group">
              {LIVREURS.map(l=><button key={l} className={`toggle-btn ${form.tournee===l?'active':''}`} onClick={()=>setForm({...form,tournee:l})}>{l}</button>)}
            </div>
          </div>
        </div>
        <div className="form-actions">
          {editId&&<button className="btn-ghost" onClick={()=>{setForm({commande:'',jour:'',creneau:'',tournee:''});setEditId(null);}}>Annuler</button>}
          <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving?'…':editId?'Mettre à jour':'Ajouter'}</button>
        </div>
      </div>
      <div className="planning-wrap">
        {jours.map(d => {
          const k = dateKey(d);
          const liste = grouped[k]||[];
          if(liste.length===0) return null;
          const badge = dateBadge(d);
          return (
            <div key={k} className="day-block">
              <div className="day-label">
                <span>{dateLabel(d)}</span>
                {badge&&<span className={badge.color==='#e8a030'?'day-badge-today':'day-badge-tomorrow'}>{badge.text}</span>}
                <span className="day-count">{liste.length}</span>
              </div>
              {liste.map(d2=>(
                <div key={d2.id} className="row-delivery">
                  <span className="cmd-mono">{d2.commande}</span>
                  {d2.client&&<span style={{fontSize:'0.82rem',color:'var(--text)',fontWeight:600,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d2.client}</span>}
                  {d2.tournee&&<span style={{fontSize:'0.78rem',fontWeight:700,color:'#6b7a9e',background:'#eaeef8',padding:'2px 8px',borderRadius:6}}>{d2.tournee}</span>}
                  <span className={`pill ${d2.creneau==='Matin'?'pill-sun':'pill-moon'}`}>{d2.creneau==='Matin'?<><SunIcon/> Matin</>:<><MoonIcon/> Après-midi</>}</span>
                  <StatusBadge s={d2.statut}/>
                  <div className="row-actions">
                    {d2.statut==='aplanifier'&&<button className="btn-status" style={{background:'#f5f3ff',color:'#7c3aed',border:'1px solid #c4b5fd'}} onClick={()=>toggleConfirm(d2)}>📋 Planifier</button>}
                  {(d2.statut==='planifiee'||d2.statut==='confirmee')&&<button className={`btn-status ${d2.statut==='confirmee'?'btn-status-undo':'btn-status-confirm'}`} onClick={()=>toggleConfirm(d2)}>{d2.statut==='planifiee'?'✓ Confirmer':'↩ Planifiée'}</button>}
                    {d2.statut!=='livree'&&<button className="icon-btn" onClick={()=>{setForm({commande:d2.commande,jour:d2.jour,creneau:d2.creneau,tournee:d2.tournee||''});setEditId(d2.id);}}>✏️</button>}
                    <button className="icon-btn red" onClick={()=>setDeleteConfirm(d2.id)}><TrashIcon/></button>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
        {deliveries.length===0&&<div className="empty">Aucune livraison planifiée pour le moment.</div>}
      </div>
      {planifierModal && (
        <PlanifierModal
          commande={planifierModal.commande}
          onConfirm={handlePlanifier}
          onCancel={() => setPlanifierModal(null)}
        />
      )}

      {deleteConfirm&&(
        <div className="overlay" onClick={()=>setDeleteConfirm(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <p>Supprimer cette livraison ?</p>
            <div className="modal-btns">
              <button className="btn-ghost" onClick={()=>setDeleteConfirm(null)}>Annuler</button>
              <button className="btn-danger" onClick={()=>handleDelete(deleteConfirm)}>Supprimer</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Livreur ───────────────────────────────────────────────────────────────────
function Livreur() {
  const [livreurChoisi, setLivreurChoisi] = useState('');
  const [deliveries, setDeliveries] = useState({duJour:[], autres:[]});
  const [loading, setLoading] = useState(false);
  const [showSig, setShowSig] = useState(null); // id de la commande à signer
  const [, forceUpdate] = useState(0);

  const today = dateKey(new Date());

  const loadCommandes = async (nom) => {
    setLoading(true);
    try {
      const all = await getLivraisons();
      const mine = all.filter(d => d.tournee === nom);
      const sortFn = (a,b) => {
        const order = {planifiee:0, confirmee:1, livree:2};
        if(order[a.statut] !== order[b.statut]) return order[a.statut]-order[b.statut];
        return SLOTS.indexOf(a.creneau)-SLOTS.indexOf(b.creneau);
      };
      const duJour = mine.filter(d => d.jour === today).sort(sortFn);
      const autres = mine.filter(d => d.jour !== today).sort((a,b) => a.jour.localeCompare(b.jour) || sortFn(a,b));
      setDeliveries({duJour, autres});
    } catch(e){console.error(e);}
    finally{setLoading(false);}
  };

  const choisirLivreur = (nom) => {
    setLivreurChoisi(nom);
    loadCommandes(nom);
  };

  const handleConfirmLoad = async (d) => {
    try {
      const updated = await updateLivraison(d.id, {statut:'confirmee'});
      setDeliveries(prev => ({
        duJour: (prev.duJour||[]).map(x => x.id===d.id ? updated : x),
        autres: (prev.autres||[]).map(x => x.id===d.id ? updated : x),
      }));
    } catch(e){console.error(e);}
  };

  const handleSignatureSave = async (sig) => {
    try {
      const updated = await updateLivraison(showSig, {statut:'livree', signature:sig, livre_le:new Date().toISOString()});
      setDeliveries(prev => ({
        duJour: (prev.duJour||[]).map(x => x.id===showSig ? updated : x),
        autres: (prev.autres||[]).map(x => x.id===showSig ? updated : x),
      }));
      setShowSig(null);
    } catch(e){console.error(e);}
  };

  const formatJour = (key) => { if(!key)return key; const d=new Date(key+'T00:00:00'); return dateLabel(d); };

  const allDeliveries = Array.isArray(deliveries) ? deliveries : [...(deliveries.duJour||[]), ...(deliveries.autres||[])];
  const counts = {aplanifier:0, planifiee:0, confirmee:0, livree:0};
  allDeliveries.forEach(d => { if(counts[d.statut]!==undefined) counts[d.statut]++; });

  // Étape 1 : choix du livreur
  if(!livreurChoisi) return (
    <div className="page page-adv">
      <div className="page-hero" style={{background:'linear-gradient(135deg,#1a2d6b 70%,#213580)'}}>
        <h2>🚚 Espace livreur</h2>
        <p>Choisissez votre tournée pour voir vos commandes du jour</p>
      </div>
      <div className="card">
        <div className="card-title">Qui êtes-vous ?</div>
        <div className="toggle-group" style={{flexWrap:'wrap'}}>
          {LIVREURS.map(l => (
            <button key={l} className="toggle-btn" style={{flex:'1 0 140px',padding:'14px',fontSize:'1rem'}} onClick={()=>choisirLivreur(l)}>
              🚚 {l}
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  // Étape 2 : liste des commandes
  return (
    <div className="page">
      <div className="page-hero" style={{background:'linear-gradient(135deg,#1a2d6b 70%,#213580)'}}>
        <h2>🚚 {livreurChoisi}</h2>
        <p>Tournée du {formatJour(today)}</p>
        <div className="hero-stats">
          <span className="hstat" style={{color:'#93c5fd'}}>🔵 {counts.planifiee} à charger</span>
          <span className="hstat" style={{color:'#fcd34d'}}>🟡 {counts.confirmee} chargée{counts.confirmee>1?'s':''}</span>
          <span className="hstat" style={{color:'#86efac'}}>🟢 {counts.livree} livrée{counts.livree>1?'s':''}</span>
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16}}>
        <button className="btn-ghost" onClick={()=>{setLivreurChoisi('');setDeliveries([]);}}>← Changer de tournée</button>
      </div>

      {loading && <div className="loading">Chargement…</div>}

      {!loading && allDeliveries.length===0 && (
        <div className="empty">Aucune commande pour votre tournée aujourd'hui.</div>
      )}

      {!loading && allDeliveries.length>0 && (
        <div className="planning-wrap">
          {/* Commandes du jour */}
          {(deliveries.duJour||[]).length>0 && <div className="day-label" style={{borderRadius:'var(--radius)',marginBottom:8}}>Aujourd'hui — {formatJour(today)} <span className="day-count">{(deliveries.duJour||[]).length}</span></div>}
          {(deliveries.duJour||[]).map(d => (
            <div key={d.id} className="card" style={{marginBottom:12,borderLeft:`4px solid ${STATUS[d.statut]?.dot||'#2563eb'}`}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
                <div>
                  <div className="result-cmd" style={{marginBottom:6}}>{d.commande}</div>
                  <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                    <span className={`pill ${d.creneau==='Matin'?'pill-sun':'pill-moon'}`}>{d.creneau==='Matin'?<><SunIcon/> Matin</>:<><MoonIcon/> Après-midi</>}</span>
                    <StatusBadge s={d.statut}/>
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:8,minWidth:200}}>
                  {d.statut==='planifiee' && (
                    <button className="btn-confirm-load" style={{padding:'10px 16px',fontSize:'0.9rem'}} onClick={()=>handleConfirmLoad(d)}>
                      📦 Confirmer le chargement
                    </button>
                  )}
                  {(d.statut==='planifiee'||d.statut==='confirmee') && (
                    <button className="btn-deliver" style={{padding:'10px 16px',fontSize:'0.9rem',marginBottom:0}} onClick={()=>setShowSig(d.id)}>
                      ✍️ Faire signer
                    </button>
                  )}
                  {d.statut==='livree' && (
                    <div className="delivered-msg">✅ Livrée</div>
                  )}
                </div>
              </div>
              {d.statut==='livree' && d.signature && (
                <div className="sig-preview" style={{marginTop:12}}>
                  <div className="rlabel" style={{marginBottom:6}}>Signature</div>
                  <img src={d.signature} alt="Signature" style={{maxWidth:200,maxHeight:80,border:'1px solid #d0d8ef',borderRadius:6}}/>
                </div>
              )}
            </div>
          ))}
          {/* Autres commandes (hors aujourd'hui) */}
          {(deliveries.autres||[]).length>0 && (
            <>
              <div style={{margin:'16px 0 8px',padding:'9px 16px',background:'#eaeef8',borderRadius:'var(--radius)',fontSize:'0.78rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.07em'}}>
                Autres jours — {(deliveries.autres||[]).length} commande{(deliveries.autres||[]).length>1?'s':''}
              </div>
              {(deliveries.autres||[]).map(d => (
                <div key={d.id} className="card" style={{marginBottom:12,borderLeft:`4px solid ${STATUS[d.statut]?.dot||'#2563eb'}`,opacity:0.85}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
                    <div>
                      <div style={{fontSize:'0.72rem',color:'var(--muted)',fontWeight:600,marginBottom:4}}>{formatJour(d.jour)}</div>
                      <div className="result-cmd" style={{marginBottom:6}}>{d.commande}</div>
                      <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                        <span className={`pill ${d.creneau==='Matin'?'pill-sun':'pill-moon'}`}>{d.creneau==='Matin'?<><SunIcon/> Matin</>:<><MoonIcon/> Après-midi</>}</span>
                        <StatusBadge s={d.statut}/>
                      </div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:8,minWidth:200}}>
                      {d.statut==='planifiee' && <button className="btn-confirm-load" style={{padding:'10px 16px',fontSize:'0.9rem'}} onClick={()=>handleConfirmLoad(d)}>📦 Confirmer le chargement</button>}
                      {(d.statut==='planifiee'||d.statut==='confirmee') && <button className="btn-deliver" style={{padding:'10px 16px',fontSize:'0.9rem',marginBottom:0}} onClick={()=>setShowSig(d.id)}>✍️ Faire signer</button>}
                      {d.statut==='livree' && <div className="delivered-msg">✅ Livrée</div>}
                    </div>
                  </div>
                  {d.statut==='livree'&&d.signature&&<div className="sig-preview" style={{marginTop:12}}><div className="rlabel" style={{marginBottom:6}}>Signature</div><img src={d.signature} alt="Signature" style={{maxWidth:200,maxHeight:80,border:'1px solid #d0d8ef',borderRadius:6}}/></div>}
                </div>
              ))}
            </>
          )}
        </div>
      )}

      {showSig && (
        <SignaturePad
          commande={allDeliveries.find(d=>d.id===showSig)?.commande}
          onSave={handleSignatureSave}
          onCancel={()=>setShowSig(null)}
        />
      )}
    </div>
  );
}

// ── Historique ───────────────────────────────────────────────────────────────
function Historique() {
  const [deliveries, setDeliveries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filtreStatut, setFiltreStatut] = useState('');

  const today = dateKey(new Date());

  useEffect(() => {
    getLivraisons()
      .then(data => {
        // Uniquement les commandes dont la date est passée (avant aujourd'hui)
        const passees = data.filter(d => d.jour < today);
        // Trier par date décroissante
        passees.sort((a,b) => b.jour.localeCompare(a.jour));
        setDeliveries(passees);
      })
      .catch(console.error)
      .finally(() => setLoading(false));
  }, []);

  const filtered = deliveries.filter(d => {
    if(filtreStatut && d.statut !== filtreStatut) return false;
    return true;
  });

  // Grouper par date
  const grouped = {};
  filtered.forEach(d => {
    if(!grouped[d.jour]) grouped[d.jour] = [];
    grouped[d.jour].push(d);
  });
  const dates = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

  const formatJour = (key) => { const d=new Date(key+'T00:00:00'); return dateLabel(d); };

  const counts = {aplanifier:0, planifiee:0, confirmee:0, livree:0};
  filtered.forEach(d => { if(counts[d.statut]!==undefined) counts[d.statut]++; });

  if(loading) return <div className="loading">Chargement…</div>;

  return (
    <div className="page" style={{maxWidth:920}}>
      <div className="page-hero">
        <h2>📂 Historique des livraisons</h2>
        <p>Toutes les commandes des jours passés</p>
        <div className="hero-stats">
          <span className="hstat" style={{color:'#93c5fd'}}>🔵 {counts.planifiee} planifiée{counts.planifiee>1?'s':''}</span>
          <span className="hstat" style={{color:'#fcd34d'}}>🟡 {counts.confirmee} confirmée{counts.confirmee>1?'s':''}</span>
          <span className="hstat" style={{color:'#86efac'}}>🟢 {counts.livree} livrée{counts.livree>1?'s':''}</span>
          <span className="hstat" style={{color:'rgba(255,255,255,0.5)'}}>Total : {filtered.length}</span>
        </div>
      </div>

      {/* Filtres */}
      <div className="card form-card">
        <div className="card-title">🔎 Filtrer par statut</div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div className="field" style={{flex:1,minWidth:160}}>
            <label>Statut</label>
            <select value={filtreStatut} onChange={e=>setFiltreStatut(e.target.value)}>
              <option value="">Tous</option>
              <option value="aplanifier">À planifier</option>
              <option value="planifiee">Planifiée</option>
              <option value="confirmee">Confirmée</option>
              <option value="livree">Livrée</option>
            </select>
          </div>
          {filtreStatut && (
            <button className="btn-ghost" onClick={()=>setFiltreStatut('')}>Effacer</button>
          )}
        </div>
      </div>

      {dates.length === 0 && <div className="empty">Aucune commande dans l'historique.</div>}

      <div className="planning-wrap">
        {dates.map(date => (
          <div key={date} className="day-block">
            <div className="day-label">
              <span>{formatJour(date)}</span>
              <span className="day-count">{grouped[date].length}</span>
            </div>
            {grouped[date].map(d => (
              <div key={d.id} className="row-delivery">
                <span className="cmd-mono">{d.commande}</span>
                {d.tournee && <span style={{fontSize:'0.78rem',fontWeight:700,color:'#6b7a9e',background:'#eaeef8',padding:'2px 8px',borderRadius:6}}>{d.tournee}</span>}
                <span className={`pill ${d.creneau==='Matin'?'pill-sun':'pill-moon'}`}>{d.creneau==='Matin'?<><SunIcon/> Matin</>:<><MoonIcon/> Après-midi</>}</span>
                <StatusBadge s={d.statut}/>
                {d.statut==='livree' && d.livre_le && (
                  <span style={{fontSize:'0.75rem',color:'var(--muted)',marginLeft:'auto'}}>
                    {new Date(d.livre_le).toLocaleString('fr-FR')}
                  </span>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

const TABS = [
  {id:'suivi',      label:'🔍 Suivi',      roles:['adv','responsable']},
  {id:'agenda',     label:'📅 Agenda',     roles:['adv','responsable']},
  {id:'tournees',   label:'📋 Tournées',   roles:['responsable']},
  {id:'livreur',    label:'🚚 Livreur',    roles:['responsable','livreur']},
  {id:'historique', label:'📂 Historique', roles:['adv','responsable','livreur']},
];
const DEFAULT_TAB = {adv:'suivi',responsable:'tournees',livreur:'livreur'};

function AppInner() {
  const {session,logout} = useAuth();
  const [page,setPage] = useState(null);
  useEffect(()=>{ if(session&&!page)setPage(DEFAULT_TAB[session.role]); if(!session)setPage(null); },[session]);
  if(!session)return <Login/>;
  const tabs = TABS.filter(t=>t.roles.includes(session.role));
  return (
    <>
      <nav className="nav">
        <div style={{display:'flex',alignItems:'center'}}>
          <div className="nav-logo-box"><AttisLogo size={0.82}/></div>
          <span className="nav-tagline">Suivi des livraisons</span>
        </div>
        <div className="nav-tabs">{tabs.map(t=><button key={t.id} className={`nav-tab ${page===t.id?'active':''}`} onClick={()=>setPage(t.id)}>{t.label}</button>)}</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span className="nav-role-badge">{session.label}</span>
          <button className="btn-logout" onClick={logout}>⬆ Déconnexion</button>
        </div>
      </nav>
      {page==='suivi'    && <Suivi/>}
      {page==='agenda'   && <Agenda/>}
      {page==='tournees' && <Tournees/>}
      {page==='livreur'    && <Livreur/>}
      {page==='historique' && <Historique/>}
    </>
  );
}

function App() {
  return <AuthProvider><AppInner/></AuthProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
