<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attis — Suivi de commande</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #1a2d6b; padding: 16px 24px; display: flex; align-items: center; justify-content: center; }
    .header img { height: 48px; }
    .header-text { color: white; }
    .header-text h1 { font-size: 1.1rem; font-weight: 700; }
    .header-text p { font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(26,45,107,0.10); padding: 36px 32px; width: 100%; max-width: 480px; }
    .card h2 { font-size: 1.2rem; font-weight: 800; color: #1a2d6b; margin-bottom: 8px; }
    .card p { font-size: 0.85rem; color: #6b7280; margin-bottom: 24px; }
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 2px solid #e5e7eb; font-size: 1rem; font-family: 'Courier New', monospace; font-weight: 700; color: #1a2d6b; outline: none; transition: border 0.2s; }
    .search-row input:focus { border-color: #1a2d6b; }
    .search-row button { padding: 12px 20px; border-radius: 10px; border: none; background: #1a2d6b; color: white; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .search-row button:hover { background: #2d4a9e; }
    .result { margin-top: 24px; padding: 20px; border-radius: 12px; border-left: 5px solid #e5e7eb; background: #f9fafb; }
    .result-commande { font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 800; color: #1a2d6b; margin-bottom: 4px; }
    .result-client { font-size: 0.95rem; font-weight: 600; color: #374151; margin-bottom: 12px; }
    .status-badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; }
    .result-detail { font-size: 0.82rem; color: #6b7280; margin-top: 4px; }
    .result-detail span { font-weight: 600; color: #374151; }
    .not-found { margin-top: 24px; padding: 16px; border-radius: 12px; background: #fef2f2; color: #dc2626; font-size: 0.88rem; font-weight: 600; text-align: center; }
    .loading { margin-top: 24px; text-align: center; color: #6b7280; font-size: 0.88rem; }
    .footer { text-align: center; padding: 16px; font-size: 0.75rem; color: #9ca3af; }
  </style>
</head>

<div class="main">
  <div class="card">
    <h2>📦 Où en est ma commande ?</h2>
    <p>Entrez votre numéro de commande pour connaître son statut en temps réel.</p>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Ex : 208447" />
      <button onclick="rechercher()">Rechercher</button>
    </div>
    <div id="result"></div>

<div class="footer">© Attis — Suivi des livraisons</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://hkicyucebizazhqcvfht.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraWN5dWNlYml6YXpocWN2Zmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDM0OTMsImV4cCI6MjA5NjI3OTQ5M30.WFGPyzBzUjwQz0sFx864rUIpr_BRTGU-9dPuUFRNgBg'
);

const STATUS = {
  aplanifier: { label: 'En attente de planification', color: '#7c3aed', bg: '#ede9fe', border: '#7c3aed' },
  planifiee:  { label: 'Planifiée', color: '#2563eb', bg: '#dbeafe', border: '#2563eb' },
  confirmee:  { label: 'En cours de chargement', color: '#d97706', bg: '#fef3c7', border: '#d97706' },
  livree:     { label: 'Livrée ✓', color: '#16a34a', bg: '#dcfce7', border: '#16a34a' },
};

function formatDate(str) {
  if (!str) return null;
  try {
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) { return str; }
}

function formatDateTime(str) {
  if (!str) return null;
  try {
    return new Date(str).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch(e) { return str; }
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') rechercher();
});

async function rechercher() {
  const num = document.getElementById('searchInput').value.trim();
  const div = document.getElementById('result');
  if (!num) return;

  div.innerHTML = '<div class="loading">Recherche en cours...</div>';

  const { data, error } = await sb.from('livraisons').select('*').eq('commande', num).limit(1);

  if (error || !data || data.length === 0) {
    div.innerHTML = '<div class="not-found">❌ Commande introuvable. Vérifiez le numéro et réessayez.</div>';
    return;
  }

  const d = data[0];
  const st = STATUS[d.statut] || STATUS.aplanifier;

  let html = '<div class="result" style="border-left-color:' + st.border + '">';
  html += '<div class="result-commande">Commande n° ' + d.commande + '</div>';
  if (d.client) html += '<div class="result-client">' + d.client + '</div>';
  html += '<span class="status-badge" style="background:' + st.bg + ';color:' + st.color + '">' + st.label + '</span>';

  if (d.delai_confirme) {
    html += '<div class="result-detail">📅 Date de livraison prévue : <span>' + formatDate(d.delai_confirme) + '</span></div>';
  } else if (d.jour) {
    html += '<div class="result-detail">📅 Date prévue : <span>' + formatDate(d.jour) + '</span></div>';
  }

  if (d.statut === 'livree' && d.livre_le) {
    html += '<div class="result-detail" style="color:#16a34a;margin-top:8px">✅ Livrée le : <span style="color:#16a34a">' + formatDateTime(d.livre_le) + '</span></div>';
  }
  if (d.signature) {
    html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #e5e7eb">';
    html += '<div style="font-size:0.78rem;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em">Signature du destinataire</div>';
    html += '<div style="background:#f9fafb;border-radius:8px;padding:8px;display:inline-block;border:1px solid #e5e7eb">';
    html += '<img src="' + d.signature + '" style="max-width:260px;max-height:120px;display:block;" alt="Signature"/>';
    html += '</div></div>';
  }

  html += '</div>';
  div.innerHTML = html;
}
</script>
